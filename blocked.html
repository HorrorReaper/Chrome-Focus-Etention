<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Blocked - Stay Focused</title>
  <!-- Reuse global styles -->
  <link rel="stylesheet" href="newtab.css" />

  <style>
    /* Page-scoped styles for blocked page */

    body {
      min-height: 100vh;
      /* keep same feel but with your sad dog image */
      background-image: url("images/sad-dog.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .blocked-main {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .blocked-card {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: stretch;
      padding: 28px 26px 24px;
    }

    .blocked-header {
      text-align: center;
    }

    .blocked-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .blocked-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    .blocked-url {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      word-break: break-all;
    }

    /* Timer section */
    .blocked-timer {
      text-align: center;
    }

    #timer-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--muted);
    }

    #timer-display {
      margin-top: 4px;
      font-size: 52px;
      font-weight: 400;
      letter-spacing: 0.15em;
      font-variant-numeric: tabular-nums;
    }

    .progress-bar {
      margin-top: 10px;
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        rgba(102, 126, 234, 0.9),
        rgba(118, 75, 162, 0.9)
      );
      transition: width 0.25s ease;
    }

    /* Options / unlock section */

    .options-section {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .options-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .options-row .settings-label {
      min-width: 140px;
      font-size: 12px;
      letter-spacing: 0.16em;
    }

    .options-row .number-input {
      width: 90px;
      padding-inline: 10px;
    }

    /* Math challenge – improved styling */

    .challenge-row {
      margin-top: 6px;
      padding: 12px 14px;
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        rgba(102, 126, 234, 0.16),
        rgba(118, 75, 162, 0.22)
      );
      border: 1px solid rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .challenge-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
    }

    .challenge-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    .challenge-question {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }

    #challengeAnswer {
      width: 110px;
      text-align: center;
      padding-inline: 12px;
    }

    /* Unlock button row */

    .blocked-actions-main {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    /* Tasks section */

    .blocked-tasks {
      margin-top: 6px;
    }

    .blocked-tasks .card-title {
      text-align: center;
      margin-bottom: 8px;
    }

    .blocked-tasks .todo-list {
      max-height: 180px;
      overflow-y: auto;
    }

    .empty-todos {
      opacity: 0.7;
      text-align: center;
      font-size: 13px;
      list-style: none;
      padding: 10px 0;
    }

    .blocked-actions-secondary {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .blocked-actions-secondary a.secondary-link {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--accent);
      font-size: 14px;
      background: transparent;
    }

    .blocked-actions-secondary a.secondary-link:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    /* Motivation footer */

    .blocked-footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      .blocked-card {
        padding-inline: 18px;
      }

      #timer-display {
        font-size: 40px;
      }

      .challenge-row {
        flex-direction: column;
        align-items: flex-start;
      }

      #challengeAnswer {
        width: 100%;
      }

      .blocked-actions-main {
        flex-direction: column;
      }

      .blocked-actions-secondary {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="blocked-main">
    <div class="card blocked-card">
      <!-- Header -->
      <div class="blocked-header">
        <div class="blocked-icon">🚫</div>
        <div class="blocked-title">Stay Focused</div>
        <div class="blocked-url" id="blocked-url">This site is blocked</div>
      </div>

      <!-- Timer -->
      <div class="blocked-timer">
        <div id="timer-label">Time remaining</div>
        <div id="timer-display">--:--</div>
      </div>

      <!-- Options / Unlock -->
      <div class="options-section">
        <div class="options-row">
          <label for="unlockMinutes" class="settings-label">
            Allow for (minutes)
          </label>
          <input
            type="number"
            id="unlockMinutes"
            min="1"
            max="240"
            value="15"
            class="number-input"
          />
        </div>

        <div id="challengeContainer" class="challenge-row">
          <div class="challenge-text">
            <div class="challenge-label">Quick check</div>
            <div id="challengeQuestion" class="challenge-question"></div>
          </div>
          <input
            type="number"
            id="challengeAnswer"
            class="number-input"
            placeholder="Answer"
          />
        </div>

        <div class="blocked-actions-main">
          <button id="unlockButton" class="primary-btn large-round">
            Unlock this site
          </button>
        </div>
      </div>

      <!-- Tasks section -->
      <div class="blocked-tasks">
        <div class="card-title">Your Tasks</div>
        <ul class="todo-list" id="todo-list">
          <li class="empty-todos">
            No tasks yet. Add some from your new tab!
          </li>
        </ul>

        <div class="blocked-actions-secondary">
          <button class="primary-btn" id="add-whitelist">
            ✓ Allow This Site
          </button>
          <a href="chrome://newtab" class="secondary-link">
            ← Back to Focus
          </a>
        </div>
      </div>

      <!-- Motivation -->
      <div class="blocked-footer" id="motivation-quote">
        Stay focused on your goals!
      </div>
    </div>
  </main>

  <script src="blocked.js"></script>
</body>
</html>
